[project]
name = "reposcope"
version = "0.1.0"
description = "LLM agent that answers architecture questions about a codebase with file and line citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=3.0,<4",
    "sqlalchemy>=2.0.36",
    # jina-embeddings-v2-base-code ships modeling code that imports internals
    # removed in transformers 5, so it only loads under the 4.x line.
    "transformers>=4.44,<5",
]

[project.scripts]
reposcope = "reposcope.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL database with pgvector (TEST_DATABASE_URL)"]
